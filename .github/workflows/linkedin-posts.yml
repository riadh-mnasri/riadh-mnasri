name: Add LinkedIn Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Titre / début du post LinkedIn'
        required: true
        type: string
      url:
        description: 'URL du post LinkedIn'
        required: true
        type: string

jobs:
  add-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepend post to both READMEs
        env:
          POST_TITLE: ${{ inputs.title }}
          POST_URL: ${{ inputs.url }}
        run: |
          python3 << 'EOF'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          title = os.environ["POST_TITLE"][:120].strip()
          url = os.environ["POST_URL"].strip()
          today = datetime.now(timezone.utc).strftime("%d %b %Y")
          new_entry = f"- [{title}]({url}) · {today}"

          start = "<!-- LINKEDIN-POSTS:START -->\n"
          end = "<!-- LINKEDIN-POSTS:END -->"
          french = Path("README.md")
          english = Path("README.en.md")
          french_before, french_tail = french.read_text(encoding="utf-8").split(start, 1)
          existing, french_after = french_tail.split(end, 1)
          english_before, english_tail = english.read_text(encoding="utf-8").split(start, 1)
          _, english_after = english_tail.split(end, 1)

          entries = [line for line in existing.splitlines() if line.startswith("- ")]
          entries = [line for line in entries if f"]({url}) · " not in line]
          section = start + "\n".join([new_entry, *entries[:4]]) + "\n" + end

          french.write_text(french_before + section + french_after, encoding="utf-8")
          english.write_text(english_before + section + english_after, encoding="utf-8")
          print(f"Added: {new_entry}")
          EOF

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Nothing to commit." && exit 0
          git add README.md README.en.md
          git commit -m "post: add LinkedIn post [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
