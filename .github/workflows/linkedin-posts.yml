name: Add LinkedIn Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Titre / début du post LinkedIn'
        required: true
        type: string
      url:
        description: 'URL du post LinkedIn'
        required: true
        type: string

jobs:
  add-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepend post to README
        run: |
          python3 << 'EOF'
          import re
          from datetime import datetime

          title = """${{ github.event.inputs.title }}"""[:120].strip()
          url   = """${{ github.event.inputs.url }}""".strip()
          today = datetime.utcnow().strftime("%d %b %Y")

          new_entry = f"- [{title}]({url}) — {today}"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Extract current posts between markers
          match = re.search(
              r"<!-- LINKEDIN-POSTS:START -->\n(.*?)<!-- LINKEDIN-POSTS:END -->",
              content, re.DOTALL
          )

          existing = match.group(1).strip() if match else ""

          # Remove placeholder text if present
          if "s'afficheront ici" in existing:
              existing = ""

          # Keep only last 4 posts + the new one = 5 max
          lines = [l for l in existing.splitlines() if l.strip().startswith("-")][:4]
          all_posts = "\n".join([new_entry] + lines)

          new_section = f"<!-- LINKEDIN-POSTS:START -->\n{all_posts}\n<!-- LINKEDIN-POSTS:END -->"

          updated = re.sub(
              r"<!-- LINKEDIN-POSTS:START -->.*?<!-- LINKEDIN-POSTS:END -->",
              new_section,
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Added: {new_entry}")
          EOF

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Nothing to commit." && exit 0
          git add README.md
          git commit -m "post: add LinkedIn post [$(date +'%Y-%m-%d')]"
          git push
